# 매일 새벽 NEIS 학사일정을 받아 academic.json 을 갱신합니다. 바뀐 게 있을 때만 커밋합니다.
# 저장소 Settings → Secrets → Actions 에 NEIS_KEY 를 넣으면 한 번에 받습니다 (없어도 동작).
name: 학사일정 갱신

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 03:00 (한국 시간)
  workflow_dispatch:
  push:                    # academic-extra.json 을 고쳐 올리면 바로 다시 합칩니다
    branches: [main]
    paths: [academic-extra.json, scripts/fetch-academic.mjs]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-academic.mjs
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
      - name: 바뀌었으면 커밋
        run: |
          git diff --quiet -- academic.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add academic.json
          git commit -m '학사일정 자동 갱신 (NEIS)'
          git pull --rebase
          git push
